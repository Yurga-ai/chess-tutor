<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Французская защита — Тренажер</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; }
        .board { display: grid; grid-template-columns: repeat(8, 1fr); border: 2px solid #555; width: 100%; aspect-ratio: 1; margin: 15px 0; border-radius: 4px; overflow: hidden; }
        .cell { display: flex; align-items: center; justify-content: center; font-size: 32px; user-select: none; cursor: pointer; }
        .white-cell { background: #eeeed2; color: #000; }
        .black-cell { background: #769656; color: #000; }
        .info-box { background: #2a2a2a; padding: 15px; border-radius: 8px; border: 1px solid #444; margin-bottom: 10px; }
        .btn { background: #4CAF50; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn:active { background: #3e8e41; }
        .highlight { box-shadow: inset 0 0 0 3px #ffeb3b; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Французская защита</h2>
        <div class="info-box">
            <div id="step-title" style="font-weight: bold; margin-bottom: 5px;">Ход 1: 1.e4</div>
            <div id="step-desc">Сделайте первый ход за белых: нажмите на пешку e2, затем на e4.</div>
        </div>
        
        <div id="board" class="board"></div>
        <button class="btn" onclick="resetGame()">Начать заново</button>
    </div>

    <script>
        const initialBoard = [
            ['♜','♞','♝','♛','♚','♝','♞','♜'],
            ['♟','♟','♟','♟','♟','♟','♟','♟'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['♙','♙','♙','♙','♙','♙','♙','♙'],
            ['♖','♘','♗','♕','♔','♗','♘','♖']
        ];

        let boardData = JSON.parse(JSON.stringify(initialBoard));
        let selectedCell = null;
        let step = 0;

        const moves = [
            { from: [6,4], to: [4,4], text: "1.e4 — Захват центра белыми", nextDesc: "Теперь соперник отвечает 1...e6 (Французская защита)." },
            { from: [1,4], to: [2,4], text: "1...e6 — Подготовка к d5", nextDesc: "Ваш ход: захватите центр полностью ходом 2.d4." },
            { from: [6,3], to: [4,3], text: "2.d4 — Полный контроль центра", nextDesc: "Черные атакуют центр: 2...d5." },
            { from: [1,3], to: [3,3], text: "2...d5 — Удар по центру!", nextDesc: "Отлично! Основная позиция Французской защиты достигнута." }
        ];

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(r + c) % 2 === 0 ? 'white-cell' : 'black-cell'}`;
                    if (selectedCell && selectedCell[0] === r && selectedCell[1] === c) {
                        cell.classList.add('highlight');
                    }
                    cell.innerText = boardData[r][c];
                    cell.onclick = () => handleCellClick(r, c);
                    boardEl.appendChild(cell);
                }
            }
        }

        function handleCellClick(r, c) {
            if (step >= moves.length) return;

            const currentTarget = moves[step];
            if (!selectedCell) {
                if (r === currentTarget.from[0] && c === currentTarget.from[1]) {
                    selectedCell = [r, c];
                }
            } else {
                if (r === currentTarget.to[0] && r === currentTarget.to[0] && r === currentTarget.to[0] || (r === currentTarget.to[0] && c === currentTarget.to[1])) {
                    boardData[r][c] = boardData[selectedCell[0]][selectedCell[1]];
                    boardData[selectedCell[0]][selectedCell[1]] = '';
                    selectedCell = null;
                    step++;
                    
                    updateStatus(currentTarget.text, currentTarget.nextDesc);

                    if (step < moves.length && step % 2 === 1) {
                        setTimeout(() => {
                            const botMove = moves[step];
                            boardData[botMove.to[0]][botMove.to[1]] = boardData[botMove.from[0]][botMove.from[1]];
                            boardData[botMove.from[0]][botMove.from[1]] = '';
                            step++;
                            updateStatus(botMove.text, botMove.nextDesc);
                            renderBoard();
                        }, 600);
                    }
                } else {
                    selectedCell = null;
                }
            }
            renderBoard();
        }

        function updateStatus(title, desc) {
            document.getElementById('step-title').innerText = title;
            document.getElementById('step-desc').innerText = desc || '';
        }

        function resetGame() {
            boardData = JSON.parse(JSON.stringify(initialBoard));
            selectedCell = null;
            step = 0;
            updateStatus("Ход 1: 1.e4", "Сделайте первый ход за белых: нажмите на пешку e2, затем на e4.");
            renderBoard();
        }

        resetGame();
    </script>
</body>
</html>
