<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обучалка: Французская защита</title>
    <!-- Подключаем стили и библиотеки для шахмат -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax5/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; text-align: center; padding: 20px; }
        #board { width: 400px; margin: 20px auto; }
        .instructions { background: #333; padding: 15px; border-radius: 8px; max-width: 400px; margin: 0 auto; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        button:hover { background: #45a049; }
    </pstyle>
</head>
<body>
    <h1>Французская защита</h1>
    <div class="instructions">
        <p id="status">Ход белых: 1. e4</p>
        <p id="description">Сделайте первый ход за белых: e2-e4</p>
    </div>
    
    <div id="board"></div>
    <button onclick="resetBoard()">Сначала</button>

    <script>
        var board = null;
        var game = new Chess();
        
        // Шаги Французской защиты
        const steps = [
            { move: 'e4', desc: 'Отлично! Белые занимают центр.' },
            { move: 'e6', desc: 'Черные отвечают e6 — подготовка к Французской защите.' },
            { move: 'd4', desc: 'Белые захватывают пространство в центре.' },
            { move: 'd5', desc: 'Черные атакуют пешку d4 пешкой d5 — классика Французской защиты!' }
        ];
        var currentStep = 0;

        function updateStatus() {
            if (currentStep < steps.length) {
                document.getElementById('status').innerText = `Шаг ${currentStep + 1} из ${steps.length}`;
                document.getElementById('description').innerText = steps[currentStep].desc;
            } else {
                document.getElementById('status').innerText = 'Поздравляем!';
                document.getElementById('description').innerText = 'Вы успешно изучите дебютные ходы Французской защиты!';
            }
        }

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            // Только белые на первом этапе
            if (currentStep % 2 === 0 && piece.search(/^b/) !== -1) return false;
            if (currentStep % 2 !== 0 && piece.search(/^w/) !== -1) return false;
        }

        function onDrop (source, target) {
            let expected = '';
            if (currentStep === 0) expected = 'e2e4';
            if (currentStep === 1) expected = 'e7e6';
            if (currentStep === 2) expected = 'd2d4';
            if (currentStep === 3) expected = 'd7d5';

            let moveStr = source + target;
            if (moveStr === expected) {
                var move = game.move({ from: source, to: target, promotion: 'q' });
                if (move === null) return 'snapback';
                currentStep++;
                updateStatus();
                
                // Если сходил пользователь, автоматически делаем ход за противника (если нужно)
                if (currentStep < steps.length && currentStep % 2 !== 0) {
                    setTimeout(() => {
                        if (currentStep === 1) { game.move({from: 'e7', to: 'e6'}); currentStep++; }
                        else if (currentStep === 3) { game.move({from: 'd7', to: 'd5'}); currentStep++; }
                        board.position(game.fen());
                        updateStatus();
                    }, 500);
                }
                return;
            } else {
                alert('Неверный ход для Французской защиты! Попробуйте другой.');
                return 'snapback';
            }
        }

        function resetBoard() {
            game.reset();
            currentStep = 0;
            board.start();
            updateStatus();
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop
        };
        board = Chessboard('board', config);
        updateStatus();
    </script>
</body>
    </html>
